name: Weekly X Bookmarks Digest

on:
  schedule:
    # Sundays 13:23 UTC = 9:23am ET. Sends bookmarks saved in the last 7 days.
    - cron: "23 13 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "week = last 7 days; all = entire Reader library (one-off full send)"
        type: choice
        options: [week, all]
        default: week

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing-brief
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Build & send bookmarks digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          READWISE_LOCATIONS: ${{ vars.READWISE_LOCATIONS }}
          READWISE_TAG: ${{ vars.READWISE_TAG }}
          READWISE_ARCHIVE_AFTER: ${{ vars.READWISE_ARCHIVE_AFTER }}
        run: node src/index.js --bookmarks-dump ${{ github.event.inputs.scope == 'all' && '--all' || '' }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmarks-digest
          path: marketing-brief/out/
          if-no-files-found: ignore
          retention-days: 14
