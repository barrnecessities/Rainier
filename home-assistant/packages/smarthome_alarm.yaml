# Coordinated wake alarm — triggered by input_datetime.wake_alarm
# The app writes to this entity; automations respond to it.

input_datetime:
  wake_alarm:
    name: Wake Alarm
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  wake_alarm_enabled:
    name: Wake Alarm Enabled
    icon: mdi:alarm-check

automation:
  # T-40 min: 8sleep pod heat begins
  - alias: "Wake Alarm — Pod pre-warm (T-40)"
    id: wake_alarm_pod_prewarm
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=40)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - if:
          - condition: state
            entity_id: input_boolean.pod_auto_enabled
            state: "on"
        then:
          - continue_on_error: true
            service: climate.set_temperature
            target:
              entity_id: climate.brandon_s_eight_sleep_side_climate
            data:
              temperature: 72

  # T-30 min: Sunrise begins — 10%, 2200K + pod 74°F
  - alias: "Wake Alarm — Hue sunrise start (T-30)"
    id: wake_alarm_hue_start
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=30)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - continue_on_error: true
            service: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: 10
              color_temp_kelvin: 2200
              transition: 60
          - if:
              - condition: state
                entity_id: input_boolean.pod_auto_enabled
                state: "on"
            then:
              - continue_on_error: true
                service: climate.set_temperature
                target:
                  entity_id: climate.brandon_s_eight_sleep_side_climate
                data:
                  temperature: 74

  # T-20 min: Sunrise step 2 — 25%, 2700K + pod 76°F
  - alias: "Wake Alarm — Hue sunrise step 2 (T-20)"
    id: wake_alarm_hue_step2
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=20)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - continue_on_error: true
            service: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: 25
              color_temp_kelvin: 2700
              transition: 120
          - if:
              - condition: state
                entity_id: input_boolean.pod_auto_enabled
                state: "on"
            then:
              - continue_on_error: true
                service: climate.set_temperature
                target:
                  entity_id: climate.brandon_s_eight_sleep_side_climate
                data:
                  temperature: 76

  # T-10 min: Sunrise step 3 — 45%, 3200K + pod 78°F
  - alias: "Wake Alarm — Hue sunrise step 3 (T-10)"
    id: wake_alarm_hue_step3
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=10)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - continue_on_error: true
            service: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: 45
              color_temp_kelvin: 3200
              transition: 120
          - if:
              - condition: state
                entity_id: input_boolean.pod_auto_enabled
                state: "on"
            then:
              - continue_on_error: true
                service: climate.set_temperature
                target:
                  entity_id: climate.brandon_s_eight_sleep_side_climate
                data:
                  temperature: 78

  # T-0: Wake time — blinds open 50%, lights 65%, pod 80°F, music starts
  - alias: "Wake Alarm — Wake time"
    id: wake_alarm_wake_time
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {{ wake.strftime('%H:%M') == now().strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - continue_on_error: true
            service: cover.set_cover_position
            target:
              entity_id:
                - cover.topdownbottomup_0001_combined
                - cover.shade_1
                - cover.shade_2
                - cover.shade_3
            data:
              position: 50
          - sequence:
              # Whole house on at a moderate morning level first…
              - continue_on_error: true
                service: light.turn_on
                target:
                  entity_id: all
                data:
                  brightness_pct: 50
                  color_temp_kelvin: 3500
                  transition: 60
              # …then the bedroom continues its sunrise curve on top.
              - continue_on_error: true
                service: light.turn_on
                target:
                  entity_id: light.bedroom
                data:
                  brightness_pct: 65
                  color_temp_kelvin: 4000
                  transition: 180
          - if:
              - condition: state
                entity_id: input_boolean.pod_auto_enabled
                state: "on"
            then:
              - continue_on_error: true
                service: climate.set_temperature
                target:
                  entity_id: climate.brandon_s_eight_sleep_side_climate
                data:
                  temperature: 80
          - sequence:
              - continue_on_error: true
                service: media_player.volume_set
                target:
                  entity_id: media_player.bedroom
                data:
                  volume_level: 0.2
              - continue_on_error: true
                service: media_player.select_source
                target:
                  entity_id: media_player.spotify_brandon_barron
                data:
                  source: Bedroom
              - delay:
                  seconds: 2
              - continue_on_error: true
                service: media_player.play_media
                target:
                  entity_id: media_player.spotify_brandon_barron
                data:
                  media_content_id: "spotify:playlist:2PscIFWQyXsQAdPZ0Y9GS2"
                  media_content_type: music
              - continue_on_error: true
                service: media_player.media_shuffle_set
                target:
                  entity_id: media_player.spotify_brandon_barron
                data:
                  shuffle: true

  # T+10 min: Blinds fully open, lights full daylight, pod 82°F
  - alias: "Wake Alarm — Post-wake brightness (T+10)"
    id: wake_alarm_post_wake
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake + timedelta(minutes=10)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.automations_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - continue_on_error: true
            service: cover.set_cover_position
            target:
              entity_id:
                - cover.topdownbottomup_0001_combined
                - cover.shade_1
                - cover.shade_2
                - cover.shade_3
            data:
              position: 100
          - continue_on_error: true
            service: light.turn_on
            target:
              entity_id: all
            data:
              brightness_pct: 85
              color_temp_kelvin: 5000
              transition: 120
          - if:
              - condition: state
                entity_id: input_boolean.pod_auto_enabled
                state: "on"
            then:
              - continue_on_error: true
                service: climate.set_temperature
                target:
                  entity_id: climate.brandon_s_eight_sleep_side_climate
                data:
                  temperature: 82
