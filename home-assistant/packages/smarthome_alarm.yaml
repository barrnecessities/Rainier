# Coordinated wake alarm — triggered by input_datetime.wake_alarm
# The app writes to this entity; automations respond to it.

input_datetime:
  wake_alarm:
    name: Wake Alarm
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  wake_alarm_enabled:
    name: Wake Alarm Enabled
    icon: mdi:alarm-check

automation:
  # T-40 min: 8sleep pod heat begins
  - alias: "Wake Alarm — Pod pre-warm (T-40)"
    id: wake_alarm_pod_prewarm
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=40)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.brandon_s_eight_sleep_side_climate
        data:
          temperature: 72

  # T-30 min: Sunrise begins — 10%, 2200K warm orange
  - alias: "Wake Alarm — Hue sunrise start (T-30)"
    id: wake_alarm_hue_start
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=30)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness_pct: 10
          color_temp_kelvin: 2200
          transition: 60

  # T-20 min: Sunrise step 2 — 25%, 2700K warm white
  - alias: "Wake Alarm — Hue sunrise step 2 (T-20)"
    id: wake_alarm_hue_step2
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=20)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness_pct: 25
          color_temp_kelvin: 2700
          transition: 120

  # T-10 min: Sunrise step 3 — 45%, 3200K soft white
  - alias: "Wake Alarm — Hue sunrise step 3 (T-10)"
    id: wake_alarm_hue_step3
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake - timedelta(minutes=10)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - service: light.turn_on
        target:
          entity_id: light.bedroom
        data:
          brightness_pct: 45
          color_temp_kelvin: 3200
          transition: 120

  # T-0: Wake time — blinds open to 50%, lights at 65% cool white
  - alias: "Wake Alarm — Wake time"
    id: wake_alarm_wake_time
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {{ wake.strftime('%H:%M') == now().strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - service: cover.set_cover_position
            target:
              entity_id: cover.topdownbottomup_0001_combined
            data:
              position: 50
          - service: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: 65
              color_temp_kelvin: 4000
              transition: 180

  # T+10 min: Blinds fully open, lights at full daylight
  - alias: "Wake Alarm — Post-wake brightness (T+10)"
    id: wake_alarm_post_wake
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {% set now = now() %}
          {{ (wake + timedelta(minutes=10)).strftime('%H:%M') == now.strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
    action:
      - parallel:
          - service: cover.set_cover_position
            target:
              entity_id: cover.topdownbottomup_0001_combined
            data:
              position: 100
          - service: light.turn_on
            target:
              entity_id: light.bedroom
            data:
              brightness_pct: 85
              color_temp_kelvin: 5000
              transition: 120
