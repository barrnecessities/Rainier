# Sun + weather blind automation
# Runs automatically unless the user overrides from the app.
# Override is cleared when the next sun event fires.

input_boolean:
  blinds_auto_mode:
    name: Blinds Auto Mode
    icon: mdi:blinds-horizontal-closed

automation:
  # Sunrise: gentle open to 30%
  - alias: "Blinds — Sunrise open"
    id: blinds_sunrise_open
    trigger:
      - platform: sun
        event: sunrise
        offset: "+00:05"
    condition:
      - condition: state
        entity_id: input_boolean.blinds_auto_mode
        state: "on"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.topdownbottomup_0001_combined
        data:
          position: 30

  # High UV / hot afternoon: close sun-facing side to 20%
  - alias: "Blinds — UV glare protection"
    id: blinds_uv_protection
    trigger:
      - platform: numeric_state
        entity_id: sensor.uv_index
        above: 5
      - platform: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 30
    condition:
      - condition: state
        entity_id: input_boolean.blinds_auto_mode
        state: "on"
      - condition: numeric_state
        entity_id: sensor.uv_index
        above: 5
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 30
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.topdownbottomup_0001_combined  # sun-facing bedroom
        data:
          position: 20

  # Overcast or rain: open wider for natural light
  - alias: "Blinds — Overcast open wider"
    id: blinds_overcast
    trigger:
      - platform: state
        entity_id: weather.home
        to:
          - overcast
          - rainy
          - pouring
          - cloudy
    condition:
      - condition: state
        entity_id: input_boolean.blinds_auto_mode
        state: "on"
      - condition: sun
        after: sunrise
        before: sunset
    action:
      - service: cover.set_cover_position
        target:
          entity_id:
            cover.topdownbottomup_0001_combined
        data:
          position: 70

  # Sunset: close all
  - alias: "Blinds — Sunset close"
    id: blinds_sunset_close
    trigger:
      - platform: sun
        event: sunset
        offset: "+00:15"
    condition:
      - condition: state
        entity_id: input_boolean.blinds_auto_mode
        state: "on"
    action:
      - service: cover.set_cover_position
        target:
          entity_id:
            cover.topdownbottomup_0001_combined
        data:
          position: 0

  # Re-enable auto mode at midnight (resets any manual override)
  - alias: "Blinds — Reset auto mode at midnight"
    id: blinds_reset_auto
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.blinds_auto_mode
