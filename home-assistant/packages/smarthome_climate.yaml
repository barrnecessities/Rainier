# Room air conditioning — Midea AC (via Midea AC LAN integration)
#
# The 8sleep pod controls BED temperature; this controls ROOM AIR temperature.
# Sleep pattern: cool the room at bedtime, turn it off at wake so the room
# warms naturally as you get up.
#
# SETUP: after adding the Midea AC LAN integration in HA, the AC appears as a
# climate entity. Its entity_id is based on the device name you gave it.
# Replace `climate.bedroom_ac` everywhere below with your actual entity_id
# (Settings → Devices & Services → Entities → search "midea" to find it).

input_boolean:
  ac_auto_enabled:
    name: AC Auto (bedtime cool)
    icon: mdi:air-conditioner

input_number:
  ac_sleep_temp:
    name: AC Sleep Temp
    min: 62
    max: 76
    step: 1
    initial: 67
    unit_of_measurement: "°F"
    icon: mdi:thermometer

  # 24h hour to start cooling. 21 = 9 PM local time (HA uses the Pi's
  # configured timezone, so set that to America/Los_Angeles for PST).
  ac_bedtime_hour:
    name: AC Bedtime Hour
    min: 18
    max: 23
    step: 1
    initial: 21
    mode: box
    icon: mdi:clock-outline

automation:
  # Bedtime: cool the room for sleep
  - alias: "Climate — Bedtime cool room"
    id: climate_bedtime_cool
    trigger:
      - platform: time_pattern
        minutes: "0"
    condition:
      - condition: state
        entity_id: input_boolean.ac_auto_enabled
        state: "on"
      # Fire only at the configured bedtime hour, on the hour
      - condition: template
        value_template: >
          {{ now().hour == states('input_number.ac_bedtime_hour') | int
             and now().minute == 0 }}
    action:
      - continue_on_error: true
        service: climate.set_temperature
        target:
          entity_id: climate.bedroom_ac
        data:
          temperature: "{{ states('input_number.ac_sleep_temp') | int }}"
          hvac_mode: cool

  # Wake time: turn the AC off so the room warms as you get up.
  # Only acts if the wake alarm is enabled, so it stays in sync with the alarm.
  - alias: "Climate — AC off at wake"
    id: climate_ac_off_at_wake
    trigger:
      - platform: template
        value_template: >
          {% set wake = today_at(states('input_datetime.wake_alarm')) %}
          {{ wake.strftime('%H:%M') == now().strftime('%H:%M') }}
    condition:
      - condition: state
        entity_id: input_boolean.wake_alarm_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.ac_auto_enabled
        state: "on"
    action:
      - continue_on_error: true
        service: climate.set_hvac_mode
        target:
          entity_id: climate.bedroom_ac
        data:
          hvac_mode: "off"

  # Safety: turn AC off when everyone leaves (avoids cooling an empty house)
  - alias: "Climate — AC off when away"
    id: climate_ac_off_away
    trigger:
      - platform: state
        entity_id: group.household_presence
        to: "not_home"
        for:
          minutes: 5
    action:
      - continue_on_error: true
        service: climate.set_hvac_mode
        target:
          entity_id: climate.bedroom_ac
        data:
          hvac_mode: "off"
