homeassistant:
  packages: !include_dir_named packages

# Exposes selected scripts as fake Philips Hue devices so Alexa (or any
# Hue-compatible voice assistant) can discover and run them with no cloud
# subscription. In the Alexa app: Devices → + → Discover, on the same WiFi.
# Say "Alexa, turn on <name>" to run a mode.
# NOTE: listen_port MUST be 80 — newer Echo devices only discover emulated
# Hue bridges on port 80.
emulated_hue:
  host_ip: 10.0.0.78
  listen_port: 80
  expose_by_default: false
  # NOTE: with expose_by_default false, every entity needs an explicit
  # hidden: false or it is NOT published to Alexa.
  entities:
    script.mode_all_off:
      name: "All Off"
      hidden: false
    script.mode_away_night:
      name: "Away Night"
      hidden: false
    script.mode_sleep:
      name: "Sleep Mode"
      hidden: false
    cover.shade_1:
      name: "Shade One"
      hidden: false
    cover.shade_2:
      name: "Shade Two"
      hidden: false
    cover.shade_3:
      name: "Shade Three"
      hidden: false
    cover.topdownbottomup_0001_combined:
      name: "Bedroom Blinds"
      hidden: false

lovelace:
  mode: yaml
  dashboards:
    lockly-hue-mobile:
      mode: yaml
      title: Lockly Hue Mobile
      icon: mdi:home-lightbulb
      show_in_sidebar: true
      filename: dashboards/lockly_hue_mobile.yaml
    smarthome-mobile:
      mode: yaml
      title: Smart Home
      icon: mdi:home-automation
      show_in_sidebar: true
      filename: dashboards/smarthome_mobile.yaml
