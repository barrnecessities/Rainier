# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages

# Alexa bridge — publishes these as fake Hue devices on port 80.
# After any change here: restart, then "Alexa, discover devices".
emulated_hue:
  host_ip: 10.0.0.78
  listen_port: 80
  expose_by_default: false
  entities:
    script.mode_all_off:
      name: "All Off"
      hidden: false
    script.mode_away_night:
      name: "Away Night"
      hidden: false
    script.mode_sleep:
      name: "Sleep Mode"
      hidden: false
    cover.bedroom_shade_1:
      name: "Shade One"
      hidden: false
    cover.bedroom_shade_2:
      name: "Shade Two"
      hidden: false
    cover.bedroom_shade_3:
      name: "Shade Three"
      hidden: false
    cover.topdownbottomup_0001_combined:
      name: "Bedroom Blinds"
      hidden: false
    input_boolean.travel_mode:
      name: "Travel Mode"
      hidden: false

lovelace:
  mode: storage
  dashboards:
    lockly-hue-mobile:
      mode: yaml
      title: Lockly Hue Mobile
      icon: mdi:home-lightbulb
      show_in_sidebar: true
      filename: dashboards/lockly_hue_mobile.yaml
    smarthome-mobile:
      mode: yaml
      title: Smart Home
      icon: mdi:home-automation
      show_in_sidebar: true
      filename: dashboards/smarthome_mobile.yaml
