<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      height: 1.5em;
      font-weight: 600;
    }

    .player-indicator {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
    }

    #board-wrap {
      background: #1565c0;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(7, 72px);
      grid-template-rows: repeat(6, 72px);
      gap: 8px;
    }

    .cell {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1a1a2e;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      position: relative;
    }

    .cell.empty:hover { background: #2a2a4e; }

    .cell.red { background: #e53935; box-shadow: 0 0 12px #e5393588; cursor: default; }
    .cell.yellow { background: #fdd835; box-shadow: 0 0 12px #fdd83588; cursor: default; }

    .cell.winning {
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    #controls {
      margin-top: 1.2rem;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    #restart { background: #1565c0; color: #fff; }
    #undo { background: #37474f; color: #fff; }

    #score {
      display: flex;
      gap: 32px;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #16213e;
      border-radius: 8px;
      padding: 8px 20px;
    }

    .score-label { font-size: 0.8rem; opacity: 0.7; margin-bottom: 2px; }
    .score-value { font-size: 1.6rem; font-weight: 700; }

    .score-box.red-box .score-value { color: #e53935; }
    .score-box.yellow-box .score-value { color: #fdd835; }

    #col-hints {
      display: grid;
      grid-template-columns: repeat(7, 72px);
      gap: 8px;
      margin-bottom: 4px;
      padding: 0 12px;
    }

    .col-hint {
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.15s;
      cursor: pointer;
      color: #90caf9;
    }

    .col-hint:hover { opacity: 1; }
  </style>
</head>
<body>
  <h1>Connect Four</h1>

  <div id="score">
    <div class="score-box red-box">
      <span class="score-label">&#x1F534; Player 1</span>
      <span class="score-value" id="score-red">0</span>
    </div>
    <div class="score-box">
      <span class="score-label">Draws</span>
      <span class="score-value" id="score-draw">0</span>
    </div>
    <div class="score-box yellow-box">
      <span class="score-label">&#x1F7E1; Player 2</span>
      <span class="score-value" id="score-yellow">0</span>
    </div>
  </div>

  <div id="status"></div>

  <div id="col-hints">
    <div class="col-hint" data-col="0">&#x25BC;</div>
    <div class="col-hint" data-col="1">&#x25BC;</div>
    <div class="col-hint" data-col="2">&#x25BC;</div>
    <div class="col-hint" data-col="3">&#x25BC;</div>
    <div class="col-hint" data-col="4">&#x25BC;</div>
    <div class="col-hint" data-col="5">&#x25BC;</div>
    <div class="col-hint" data-col="6">&#x25BC;</div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="controls">
    <button id="undo">Undo</button>
    <button id="restart">New Game</button>
  </div>

  <script>
    const ROWS = 6, COLS = 7;
    let board, currentPlayer, gameOver, history;
    let scores = { red: 0, yellow: 0, draw: 0 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const cells = [];

    function init() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      currentPlayer = 'red';
      gameOver = false;
      history = [];
      renderBoard();
      updateStatus();
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      cells.length = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => drop(c));
          cells.push(cell);
          boardEl.appendChild(cell);
        }
      }
    }

    function getCellEl(r, c) {
      return cells[r * COLS + c];
    }

    function syncBoard() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = getCellEl(r, c);
          el.className = 'cell ' + (board[r][c] || 'empty');
        }
      }
    }

    function drop(col) {
      if (gameOver) return;
      let row = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][col]) { row = r; break; }
      }
      if (row === -1) return;

      board[row][col] = currentPlayer;
      history.push({ row, col, player: currentPlayer });
      syncBoard();

      const winning = checkWin(row, col);
      if (winning) {
        gameOver = true;
        winning.forEach(([r, c]) => getCellEl(r, c).classList.add('winning'));
        scores[currentPlayer]++;
        updateScores();
        statusEl.innerHTML = `<span class="player-indicator" style="background:${currentPlayer==='red'?'#e53935':'#fdd835'}"></span>${currentPlayer === 'red' ? 'Player 1' : 'Player 2'} wins!`;
        return;
      }

      if (board[0].every(cell => cell !== null)) {
        gameOver = true;
        scores.draw++;
        updateScores();
        statusEl.textContent = "It's a draw!";
        return;
      }

      currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
      updateStatus();
    }

    function updateStatus() {
      const color = currentPlayer === 'red' ? '#e53935' : '#fdd835';
      const name = currentPlayer === 'red' ? 'Player 1' : 'Player 2';
      statusEl.innerHTML = `<span class="player-indicator" style="background:${color}"></span>${name}'s turn`;
    }

    function updateScores() {
      document.getElementById('score-red').textContent = scores.red;
      document.getElementById('score-yellow').textContent = scores.yellow;
      document.getElementById('score-draw').textContent = scores.draw;
    }

    function checkWin(row, col) {
      const player = board[row][col];
      const directions = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of directions) {
        let line = [[row, col]];
        for (let d = 1; d <= 3; d++) {
          const r = row + dr*d, c = col + dc*d;
          if (r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===player) line.push([r,c]); else break;
        }
        for (let d = 1; d <= 3; d++) {
          const r = row - dr*d, c = col - dc*d;
          if (r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]===player) line.push([r,c]); else break;
        }
        if (line.length >= 4) return line;
      }
      return null;
    }

    document.getElementById('restart').addEventListener('click', init);

    document.getElementById('undo').addEventListener('click', () => {
      if (history.length === 0) return;
      const last = history.pop();
      board[last.row][last.col] = null;
      gameOver = false;
      currentPlayer = last.player;
      syncBoard();
      updateStatus();
    });

    document.querySelectorAll('.col-hint').forEach(hint => {
      hint.addEventListener('click', () => drop(+hint.dataset.col));
    });

    init();
  </script>
</body>
</html>
